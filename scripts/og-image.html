<!doctype html>
<!--
  Sorgente dell'anteprima social (public/og-image.png, 1200x630).

  Rigenerare dopo ogni cambio di posizionamento (ruolo, stack, dominio):

    CHROME=~/.cache/ms-playwright/chromium-1228/chrome-linux64/chrome
    $CHROME --headless --disable-gpu --no-sandbox --hide-scrollbars \
      --window-size=1200,630 --default-background-color=00000000 \
      --screenshot=public/og-image.png scripts/og-image.html

  Il font e' il generico `sans-serif`, non un font scelto: il sito non dichiara
  font-family da nessuna parte (index.css e' solo un reset), quindi eredita il
  sans di default del browser e l'immagine deve fare lo stesso. Attenzione: il
  default di Chrome headless e' *serif*, va dichiarato esplicitamente.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; padding: 0; }
      body {
        width: 1200px; height: 630px;
        font-family: sans-serif;
        background: #0d0d1a;
        position: relative; overflow: hidden;
      }
      /* Gli stessi orb della home (HomePage.jsx), fermi invece che animati. */
      .orb { position: absolute; border-radius: 50%; }
      .orb-1 { top: -80px;  left: -60px;  width: 620px; height: 620px;
               background: radial-gradient(circle, #6C63FF26, transparent 70%); }
      .orb-2 { bottom: -140px; right: -80px; width: 560px; height: 560px;
               background: radial-gradient(circle, #FF658422, transparent 70%); }
      .orb-3 { top: 55%; right: 30%; width: 320px; height: 320px;
               background: radial-gradient(circle, #43B89C14, transparent 70%); }

      .content { position: relative; z-index: 1; padding: 150px 0 0 80px; }

      h1 {
        display: inline-block;
        margin: 0 0 10px;
        font-size: 84px; font-weight: 900; letter-spacing: -2px; line-height: 1.1;
        background: linear-gradient(135deg, #6C63FF, #FF6584, #F7971E);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .role {
        margin: 0 0 74px;
        font-size: 38px; font-weight: 700; letter-spacing: 0.5px; color: #9090b0;
      }
      .chips { display: flex; gap: 20px; margin-bottom: 76px; }
      .chip {
        padding: 16px 26px; border-radius: 14px;
        font-size: 25px; font-weight: 700;
      }
      /* Tinte schiarite come lighten(colore, 0.35) in src/lib/color.js:
         gli accenti pieni non arrivano a 4.5:1 sul fondo scuro. */
      .c1 { color: #a09aff; background: #6C63FF1f; border: 1px solid #6C63FF4d; }
      .c2 { color: #ff9baf; background: #FF65841f; border: 1px solid #FF65844d; }
      .c3 { color: #85d1bf; background: #43B89C1f; border: 1px solid #43B89C4d; }
      .c4 { color: #fabb6d; background: #F7971E1f; border: 1px solid #F7971E4d; }

      .domain { font-size: 26px; font-weight: 700; color: #a09aff; }
    </style>
  </head>
  <body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="content">
      <h1>Federico Ordonselli</h1>
      <p class="role">Junior Full-Stack Developer &middot; Security &middot; Builder</p>
      <div class="chips">
        <span class="chip c1">React</span>
        <span class="chip c2">Next.js</span>
        <span class="chip c3">PostgreSQL</span>
        <span class="chip c4">Security+ &middot; CySA+</span>
      </div>
      <div class="domain">ordonselli.info</div>
    </div>
  </body>
</html>
